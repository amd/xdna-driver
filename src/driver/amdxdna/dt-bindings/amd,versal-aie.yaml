%YAML 1.2
---
$id: http://devicetree.org/schemas/accel/amd,versal-aie.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: AMD XDNA AIE Accelerator (Versal Platform)

maintainers:
  - XRT Team <runtimeca39d@amd.com>

description: |
  AMD XDNA AI Engine accelerator nodes on ARM SoC platforms (e.g. Versal
  VEK385).  The compatible string selects the management transport at
  runtime:

    amd,versal-aie-rpmsg — RPMsg over VirtIO through a remoteproc
    amd,versal-aie       — Shared memory mailbox + ZynqMP IPI

  The platform driver probes on this node and creates a DRM/accel device
  (/dev/accel/accelN).

  CMA pools are described by name in memory-region-names.  Two roles
  are recognized:

    "rpu-cma"     Bound to the platform device itself, so that
                  dma_alloc_coherent() on /dev/accel/accelN's parent
                  pulls from this pool.  Used for kernel-side
                  firmware-visible mgmt buffers (async event ring,
                  FW DRAM log, FW event-trace ring, mpnpufw work
                  buffer) and as the last-resort fallback for BO
                  allocations.  On platforms whose remote firmware
                  can only address the lower 4 GB of physical memory
                  (e.g. 32-bit RPU), this region MUST live in that
                  window.  The driver pins the platform device to a
                  32-bit DMA mask.  Optional - if absent, the parent
                  device retains its DT-/system-default CMA pool.

    "app-bank<N>" 0-indexed AIE-visible CMA banks (N = 0..7).  Each
                  is bound to a child device with a 64-bit DMA mask
                  and addressed by userspace as bank N via the low 8
                  bits of the BO `flags` field.  Intended for buffers
                  consumed by CERT and the AIE shim DMA only (HSA
                  queue, instruction BOs, args/IFM/OFM, CERT log /
                  debug / trace).  When userspace omits the bank bits
                  in BO flags, the AMDXDNA_CREATE_BO ioctl defaults
                  to bank 0, so "app-bank0" is the recommended name
                  for the first AIE region.  If "app-bank0" is not
                  declared (or its pool is exhausted), the BO falls
                  back to the "rpu-cma" / system default pool.

  All listed regions must be "shared-dma-pool" with the "reusable"
  property so the CMA allocator can manage them.  Unknown names are
  silently ignored to allow forward-compatible additions.

properties:
  compatible:
    oneOf:
      - description: RPMsg over VirtIO (remoteproc management channel)
        const: amd,versal-aie-rpmsg
      - description: Shared memory mailbox + ZynqMP IPI
        const: amd,versal-aie

  amd,remoteproc:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: |
      Phandle to the remoteproc node that hosts the NPU firmware.
      The driver resolves this at probe time to:
        1. Defer probe until the remoteproc is registered.
        2. Verify that RPMsg channels originate from this remoteproc
           (reject channels from other remoteprocs).

  memory-region:
    minItems: 1
    maxItems: 9
    description: |
      Phandles to reserved-memory nodes.  The role of each entry is
      determined by the matching name in memory-region-names, not by
      its position.  See memory-region-names below.

  memory-region-names:
    minItems: 1
    maxItems: 9
    description: |
      One name per entry in memory-region.  Allowed values:
        "rpu-cma"     - default region bound to the platform device
                        (must appear at most once).
        "app-bank0".."app-bank7"
                      - AIE-visible 64-bit CMA banks (each index must
                        be unique).

      At least one of these must be present.  Names that do not match
      the patterns above are ignored by the driver.
    items:
      pattern: "^(rpu-cma|app-bank[0-7])$"

additionalProperties: false

required:
  - compatible

examples:
  - |
    /* RPMsg transport (requires remoteproc + rpmsg-aie-mgmt channel) */
    amdxdna {
        compatible = "amd,versal-aie-rpmsg";
        amd,remoteproc = <&r5f_0>;
    };

  - |
    /*
     * Minimal shmem example - remoteproc binding only, no dedicated CMA
     * regions.  All buffer allocations use the system default CMA
     * pool.  Fine for bring-up but not recommended for production:
     * mgmt buffers may end up above 4 GB (unreachable by a 32-bit
     * RPU), and AIE banks fall back to the same default pool.
     */
    amdxdna {
        compatible = "amd,versal-aie";
        amd,remoteproc = <&r5f_0>;
    };

  - |
    /*
     * Recommended layout for T20-class platforms.
     *
     *   "rpu-cma"   : 64 MB at 0x70000000 (< 4 GB, RPU-reachable),
     *                 used for FW log/trace/work/async-event buffers
     *                 allocated by amdxdna_mgmt_buff_alloc().
     *
     *   "app-bank0" : 4 GB at 0x800000000 (> 4 GB, 64-bit only),
     *                 used for HSA queue, instruction BOs,
     *                 args/IFM/OFM BOs, CERT log/debug/trace BOs.
     *                 Selected by default for user-mode BO ioctls.
     */
    / {
        reserved-memory {
            #address-cells = <2>;
            #size-cells = <2>;
            ranges;

            rpu_cma: rpu-cma@70000000 {
                compatible = "shared-dma-pool";
                reg = <0x0 0x70000000 0x0 0x04000000>;
                reusable;
            };

            aie_cma0: aie-cma@8_00000000 {
                compatible = "shared-dma-pool";
                size      = <0x1 0x00000000>;
                alignment = <0x0 0x00100000>;
                reusable;
            };
        };
    };

    amdxdna {
        compatible = "amd,versal-aie";
        amd,remoteproc = <&r5f_0>;
        memory-region       = <&rpu_cma>, <&aie_cma0>;
        memory-region-names = "rpu-cma", "app-bank0";
    };

  - |
    /*
     * Example with multiple AIE banks.  The order in memory-region
     * does not matter; the role/index is determined by name.
     *
     *   "app-bank0" : 1 GB at 0x800000000
     *   "app-bank1" : 1 GB at 0x840000000
     *   "rpu-cma"   : 64 MB at 0x70000000
     *
     * Userspace selects "app-bank1" with flags bit 1 set.
     */
    / {
        reserved-memory {
            #address-cells = <2>;
            #size-cells = <2>;
            ranges;

            rpu_cma: rpu-cma@70000000 {
                compatible = "shared-dma-pool";
                reg = <0x0 0x70000000 0x0 0x04000000>;
                reusable;
            };

            aie_cma0: aie-cma@8_00000000 {
                compatible = "shared-dma-pool";
                reg = <0x8 0x00000000 0x0 0x40000000>;
                reusable;
            };

            aie_cma1: aie-cma@8_40000000 {
                compatible = "shared-dma-pool";
                reg = <0x8 0x40000000 0x0 0x40000000>;
                reusable;
            };
        };
    };

    amdxdna {
        compatible = "amd,versal-aie";
        amd,remoteproc = <&r5f_0>;
        memory-region       = <&aie_cma0>, <&rpu_cma>, <&aie_cma1>;
        memory-region-names = "app-bank0", "rpu-cma", "app-bank1";
    };
