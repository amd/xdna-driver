CONFIG_XILINX_AIE_NPI_INTERNAL=y
CONFIG_XILINX_AIE_SINGLE_NSU_LOCK=y
CONFIG_XILINX_AIE=m
CONFIG_DYNAMIC_DEBUG=y
CONFIG_DYNAMIC_DEBUG_CORE=y
CONFIG_DRM_ACCEL=y
CONFIG_AUXILIARY_BUS=y
CONFIG_DRM_VGEM=y

# Video pipeline (MIPI-RX ISP capture) PL drivers. Without these the
# xlnx,preprocess-1.0 / ai-layout-formatter nodes have no driver, so
# preprocess_accel never binds, visp_ss/vcap stay in deferred probe, and
# /proc/vsi is never created.
CONFIG_XILINX_AI_LAYOUT_FORMATTER=y
CONFIG_VIDEO_XILINX_PREPROCESS=y

# Disable automatic version appending from SCM (git)
# CONFIG_LOCALVERSION_AUTO is not set
